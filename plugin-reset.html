<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>重置密码 · ShopSage</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root { --brand:#1A56DB; --ink:#0f172a; --sub:#64748b; --line:#e2e8f0; --err:#e11d48; --ok:#0E7C66; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Microsoft YaHei",Arial,sans-serif;
         background:linear-gradient(160deg,#eef2ff 0%,#f8fafc 60%); display:flex; align-items:center; justify-content:center; padding:24px; color:var(--ink); }
  .card { width:100%; max-width:400px; background:#fff; border-radius:18px; padding:32px 28px; box-shadow:0 18px 50px -12px rgba(26,86,219,.25); border:1px solid rgba(226,232,240,.8); }
  .brand { display:flex; align-items:center; gap:10px; margin-bottom:22px; }
  .brand .logo { width:40px; height:40px; border-radius:10px; background:#eff6ff; display:flex; align-items:center; justify-content:center; font-weight:900; color:var(--brand); font-size:20px; }
  .brand .name { font-size:18px; font-weight:800; }
  .brand .sub { font-size:11px; color:#94a3b8; margin-top:2px; }
  h1 { font-size:20px; margin:2px 0 4px; }
  .desc { font-size:12px; color:var(--sub); margin:0 0 20px; line-height:1.5; }
  .field { margin-bottom:14px; }
  .field label { display:block; font-size:12px; font-weight:600; color:#334155; margin-bottom:6px; }
  .pw { position:relative; }
  input { width:100%; padding:13px 42px 13px 14px; border:1px solid var(--line); border-radius:10px; font-size:14px; outline:none; transition:.15s; }
  input:focus { border-color:var(--brand); box-shadow:0 0 0 3px rgba(26,86,219,.14); }
  .eye { position:absolute; right:8px; top:50%; transform:translateY(-50%); border:none; background:none; cursor:pointer; font-size:16px; color:#94a3b8; padding:4px; }
  .eye:hover { color:var(--brand); }
  button.submit { width:100%; padding:13px; border:none; border-radius:10px; background:var(--brand); color:#fff; font-size:15px; font-weight:700; cursor:pointer; margin-top:6px; box-shadow:0 6px 16px rgba(26,86,219,.28); }
  button.submit:disabled { opacity:.6; cursor:not-allowed; }
  .msg { margin-top:14px; font-size:13px; min-height:20px; text-align:center; }
  .msg.err { color:var(--err); } .msg.ok { color:var(--ok); }
  .hint { margin-top:16px; font-size:11px; color:#94a3b8; text-align:center; line-height:1.6; }
  .center { text-align:center; }
  .done-ic { font-size:40px; margin-bottom:8px; }
</style>
</head>
<body>
  <div class="card" id="card">
    <div class="brand">
      <div class="logo">S</div>
      <div><div class="name">ShopSage</div><div class="sub">跨境电商经营助手</div></div>
    </div>

    <!-- 状态：等待输入新密码 -->
    <div id="form-view">
      <h1>设置新密码</h1>
      <p class="desc">为你的 ShopSage 账号设置一个新密码，设置完成后回到插件用新密码登录即可。</p>
      <div class="field">
        <label>新密码</label>
        <div class="pw">
          <input id="pw1" type="password" placeholder="至少 6 位" autocomplete="new-password" />
          <button type="button" class="eye" data-for="pw1">👁</button>
        </div>
      </div>
      <div class="field">
        <label>确认新密码</label>
        <div class="pw">
          <input id="pw2" type="password" placeholder="再输一次" autocomplete="new-password" />
          <button type="button" class="eye" data-for="pw2">👁</button>
        </div>
      </div>
      <button class="submit" id="go">确认修改</button>
      <div class="msg" id="msg"></div>
      <div class="hint" id="hint"></div>
    </div>

    <!-- 状态：成功 -->
    <div id="done-view" style="display:none;" class="center">
      <div class="done-ic">✅</div>
      <h1>密码已更新</h1>
      <p class="desc">你的新密码已生效。回到 ShopSage 插件，用邮箱 + 新密码登录即可。</p>
      <div class="hint">可以关闭本页面了。</div>
    </div>

    <!-- 状态：链接无效 -->
    <div id="bad-view" style="display:none;" class="center">
      <div class="done-ic">⚠️</div>
      <h1>链接无效或已过期</h1>
      <p class="desc">重置链接一般 15 分钟内有效。请回到插件重新点一次「忘记密码」，用最新那封邮件里的链接。</p>
    </div>
  </div>

<script>
  // ️⬇️ 部署前必填：把这两行替换成你 background.js 顶部的真实值
  var SUPABASE_URL = 'https://whbtqssluvcvhonxcwnt.supabase.co';
  var SUPABASE_ANON = 'sb_publishable_eQqsWugbYzmkO-YsokY_Ow__-9fxPAv';

  var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON, {
    auth: { persistSession: true, autoRefreshToken: false, detectSessionInUrl: true }
  });

  var msgEl = document.getElementById('msg');
  var hintEl = document.getElementById('hint');
  var goBtn = document.getElementById('go');
  function setMsg(t, k){ msgEl.textContent = t || ''; msgEl.className = 'msg' + (k ? ' ' + k : ''); }

  // 眼睛切换
  document.querySelectorAll('.eye').forEach(function(b){
    b.addEventListener('click', function(){
      var i = document.getElementById(b.getAttribute('data-for'));
      var show = i.type === 'password'; i.type = show ? 'text' : 'password'; b.textContent = show ? '🙈' : '👁';
    });
  });

  var sessionReady = false;

  async function tryExchangeCode(){
    // PKCE 流程：URL 带 ?code=
    var params = new URLSearchParams(location.search);
    var code = params.get('code');
    if (code) {
      try { await sb.auth.exchangeCodeForSession(code); } catch(e){ /* 交给下面的 getSession 兜底 */ }
    }
  }

  async function boot(){
    hintEl.textContent = '正在校验重置链接…';
    await tryExchangeCode();
    var res = await sb.auth.getSession();
    var session = res && res.data && res.data.session;
    if (session && session.user) {
      // 只有当链接确实是 recovery（hash 里带 type=recovery 或 code 交换成功）才放行
      sessionReady = true;
      document.getElementById('hint').textContent = '当前账号：' + (session.user.email || '');
      setMsg('');
    } else {
      show('bad');
    }
  }

  function show(v){
    document.getElementById('form-view').style.display = (v==='form')?'':'none';
    document.getElementById('done-view').style.display = (v==='done')?'':'none';
    document.getElementById('bad-view').style.display  = (v==='bad') ?'':'none';
  }

  goBtn.addEventListener('click', async function(){
    if (!sessionReady) { show('bad'); return; }
    var p1 = document.getElementById('pw1').value;
    var p2 = document.getElementById('pw2').value;
    if (!p1 || p1.length < 6) { setMsg('密码至少 6 位', 'err'); return; }
    if (p1 !== p2) { setMsg('两次输入的密码不一致', 'err'); return; }
    goBtn.disabled = true; setMsg('正在更新…');
    var r = await sb.auth.updateUser({ password: p1 });
    goBtn.disabled = false;
    if (r.error) {
      var m = (r.error.message || '').toLowerCase();
      setMsg('修改失败：' + (r.error.message || '未知错误'), 'err');
    } else {
      show('done');
    }
  });

  boot();
</script>
</body>
</html>
