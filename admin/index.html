<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>ShopSage 运营后台</title>
<link rel="icon" type="image/png" href="../logo128.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --brand:#0E7C66; --brand-d:#0a5f4f; --brand-dd:#0b3b31; --brand-xl:#37c9a5;
    --brand-l:#E8F3F0; --brand-ll:#F3FAF8; --ink:#1f2a26; --muted:#6b7d78; --line:#e6ece9;
    --gold:#c88a1a; --danger:#d64545; --warn:#b35900; --ok:#0E7C66;
    --shadow:0 1px 2px rgba(14,124,102,.06),0 6px 24px -12px rgba(14,124,102,.18);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:"Microsoft YaHei","PingFang SC",-apple-system,"Segoe UI",Arial,sans-serif;color:var(--ink);background:linear-gradient(180deg,#f4f8f7 0%,#eef4f2 100%);min-height:100vh;-webkit-font-smoothing:antialiased}
  .hidden{display:none!important}
  a{color:var(--brand)}
  ::selection{background:var(--brand-l)}

  /* ---------- 登录 ---------- */
  #login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .lcard{position:relative;background:#fff;border-radius:20px;box-shadow:var(--shadow);width:380px;max-width:100%;padding:40px 34px 30px;overflow:hidden}
  .lcard::before{content:"";position:absolute;top:0;left:0;right:0;height:5px;background:linear-gradient(90deg,var(--brand),var(--brand-xl))}
  .lcard .logo{width:70px;height:70px;display:block;margin:6px auto 12px;border-radius:16px}
  .lcard h1{font-size:21px;color:var(--brand-d);text-align:center;letter-spacing:.5px}
  .lcard .sub{text-align:center;color:var(--muted);font-size:13px;margin:4px 0 24px}
  .fld{margin-bottom:15px}
  .fld label{display:block;font-size:12.5px;color:#4a5a55;margin-bottom:6px;font-weight:700}
  .fld input,.fld select,textarea{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:11px;font-size:14px;font-family:inherit;background:#fbfdfc;transition:.15s;color:var(--ink)}
  .fld input:focus,.fld select:focus,textarea:focus{outline:none;border-color:var(--brand);background:#fff;box-shadow:0 0 0 3px rgba(14,124,102,.12)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:11px;padding:10px 16px;font-size:14px;font-weight:700;cursor:pointer;background:linear-gradient(180deg,var(--brand),var(--brand-d));color:#fff;box-shadow:0 4px 12px -4px rgba(14,124,102,.5);transition:.15s}
  .btn:hover{filter:brightness(1.05);transform:translateY(-1px)}
  .btn:active{transform:translateY(0)}
  .btn.block{width:100%;padding:13px;font-size:15px;letter-spacing:2px}
  .btn.gray{background:#eef3f1;color:#3a4b46;box-shadow:none}
  .btn.gray:hover{background:#e5ede9}
  .btn.sm{padding:7px 12px;font-size:12.5px;border-radius:9px}
  .btn.danger{background:linear-gradient(180deg,#e05a5a,var(--danger));box-shadow:0 4px 12px -4px rgba(214,69,69,.5)}
  .lerr{color:var(--danger);font-size:13px;margin-top:14px;min-height:18px;text-align:center}

  /* ---------- 应用外壳 ---------- */
  #app{display:flex;min-height:100vh}
  .side{width:224px;flex:0 0 auto;background:linear-gradient(180deg,var(--brand-dd) 0%,#0e5a4a 100%);color:#cfe9e2;display:flex;flex-direction:column;padding:22px 0}
  .side .brand{display:flex;align-items:center;gap:10px;padding:0 22px 20px;font-weight:800;color:#fff;font-size:17px}
  .side .brand img{width:32px;height:32px;border-radius:8px;background:rgba(255,255,255,.12);padding:2px}
  .side .brand small{display:block;font-size:11px;font-weight:500;color:#8fc4b6;letter-spacing:1px}
  .nav{padding:6px 12px;flex:1}
  .nav a{display:flex;align-items:center;gap:10px;padding:11px 14px;margin:2px 0;color:#bcd9d1;text-decoration:none;font-size:14px;cursor:pointer;border-radius:10px;transition:.15s}
  .nav a .ic{width:18px;text-align:center;opacity:.9}
  .nav a:hover{background:rgba(255,255,255,.06);color:#fff}
  .nav a.on{background:linear-gradient(90deg,rgba(55,201,165,.22),rgba(55,201,165,.05));color:#fff;font-weight:700;box-shadow:inset 3px 0 0 var(--brand-xl)}
  .side .foot{padding:14px 22px 0;font-size:12px;color:#7fb3a7;border-top:1px solid rgba(255,255,255,.08);margin-top:8px}
  .side .foot .em{color:#d7efe8;font-weight:600;word-break:break-all}
  .side .foot a{color:#8fc4b6;cursor:pointer;text-decoration:underline}

  .main{flex:1;padding:26px 30px;overflow:auto}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
  .topbar h2{font-size:22px;color:var(--brand-d);font-weight:800}
  .topbar .who{font-size:12.5px;color:var(--muted);background:#fff;border:1px solid var(--line);padding:6px 12px;border-radius:20px}

  /* ---------- 卡片/统计 ---------- */
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:14px;margin-bottom:6px}
  .card{position:relative;background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);overflow:hidden}
  .card::after{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--brand)}
  .card.acc::after{background:var(--gold)} .card.warn::after{background:var(--danger)}
  .card .n{font-size:27px;font-weight:800;color:var(--brand-d);line-height:1.1}
  .card .l{font-size:12.5px;color:var(--muted);margin-top:4px}

  .panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 20px;box-shadow:var(--shadow);margin-bottom:16px}
  .panel .pt{font-weight:800;color:var(--brand-d);margin-bottom:14px;font-size:15px;display:flex;align-items:center;gap:8px}
  .panel .pt::before{content:"";width:4px;height:16px;background:var(--brand);border-radius:2px;display:inline-block}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
  .row .fld{margin-bottom:0;min-width:130px}

  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:10px 12px;border-bottom:1px solid #f0f4f2}
  th{color:#4a5a55;font-weight:700;background:var(--brand-ll);position:sticky;top:0;font-size:12.5px}
  tbody tr:hover td{background:#fafdfc}
  .tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:700}
  .tag.on{background:#e6f6ef;color:var(--ok)} .tag.off{background:#fdecec;color:#b23}
  .tag.warn{background:#fff3e0;color:var(--warn)} .tag.mut{background:#eef2f1;color:#64748b}
  .mono{font-family:ui-monospace,Consolas,monospace}
  .codes{font-family:ui-monospace,Consolas,monospace;background:var(--brand-ll);border:1px solid #dcebe6;border-radius:11px;padding:14px 16px;margin-top:14px;white-space:pre-wrap;word-break:break-all;font-size:13.5px;max-height:260px;overflow:auto;color:var(--brand-dd)}
  .muted{color:var(--muted);font-size:12.5px}
  .empty{text-align:center;color:#9aa5a3;padding:34px;font-size:14px}

  #toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--brand-dd);color:#fff;padding:12px 22px;border-radius:12px;font-size:14px;box-shadow:0 10px 30px -8px rgba(0,0,0,.35);opacity:0;transition:.25s;pointer-events:none;z-index:99}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  .fb{border-bottom:1px solid #f0f4f2;padding:14px 0} .fb:last-child{border-bottom:none}
  .fb .meta{font-size:12px;color:var(--muted);margin-bottom:5px;display:flex;gap:8px;flex-wrap:wrap}
  .fb .meta b{color:var(--brand-d)}
  .fb .msg{font-size:14px;color:var(--ink)}
  .fb pre{margin-top:8px;background:var(--brand-ll);border-radius:9px;padding:9px 12px;font-size:11.5px;color:#4a5a55;white-space:pre-wrap;max-height:130px;overflow:auto}
  @media(max-width:720px){.side{width:64px}.side .brand span,.side .brand small,.nav a .tx,.side .foot{display:none}.main{padding:18px}}
</style>
</head>
<body>
  <!-- 登录 -->
  <div id="login">
    <form class="lcard" id="loginForm">
      <img class="logo" src="../logo128.png" alt="ShopSage">
      <h1>ShopSage 运营后台</h1>
      <div class="sub">管理员登录 · 授权与兑换码管理</div>
      <div class="fld"><label>邮箱</label><input id="le" type="email" autocomplete="username" placeholder="admin@shopsage.cc" required></div>
      <div class="fld"><label>密码</label><input id="lp" type="password" autocomplete="current-password" placeholder="••••••••" required></div>
      <button class="btn block" id="lbtn" type="submit">登 录</button>
      <div class="lerr" id="lerr"></div>
    </form>
  </div>

  <!-- 应用 -->
  <div id="app" class="hidden">
    <div class="side">
      <div class="brand"><img src="../logo128.png"><div>ShopSage<small>运营后台</small></div></div>
      <div class="nav">
        <a data-tab="overview" class="on"><span class="ic">◎</span><span class="tx">概览</span></a>
        <a data-tab="members"><span class="ic">👥</span><span class="tx">用户与会员</span></a>
        <a data-tab="codes"><span class="ic">🎟</span><span class="tx">兑换码</span></a>
        <a data-tab="feedback"><span class="ic">💬</span><span class="tx">反馈</span></a>
        <a data-tab="telemetry"><span class="ic">📈</span><span class="tx">遥测</span></a>
      </div>
      <div class="foot"><span class="em" id="whoami"></span><br><a id="logout">退出登录</a></div>
    </div>
    <div class="main">
      <div class="topbar"><h2 id="tabTitle">概览</h2><div class="who">ShopSage · 运营控制台</div></div>

      <div class="tab" id="tab-overview">
        <div class="cards" id="statCards"><div class="empty">加载中…</div></div>
      </div>

      <div class="tab hidden" id="tab-members">
        <div class="panel">
          <div class="row">
            <div class="fld"><label>搜索邮箱</label><input id="mSearch" placeholder="输入邮箱片段"></div>
            <button class="btn sm" id="mGo">查询</button>
            <button class="btn sm gray" id="mRefresh">刷新</button>
          </div>
        </div>
        <div class="panel" style="padding:0;overflow:auto;max-height:70vh"><table id="mTable"></table></div>
      </div>

      <div class="tab hidden" id="tab-codes">
        <div class="panel">
          <div class="pt">批量生成兑换码</div>
          <div class="row">
            <div class="fld"><label>套餐</label>
              <select id="gPlan">
                <option value="month|30">月卡 · 30天</option>
                <option value="quarter|90">季卡 · 90天</option>
                <option value="year|365">年卡 · 365天</option>
                <option value="shopgroup|365">店群年卡 · 365天</option>
              </select>
            </div>
            <div class="fld"><label>店铺额度</label><input id="gStores" type="number" value="10" min="1" max="200"></div>
            <div class="fld"><label>数量</label><input id="gCount" type="number" value="10" min="1" max="500"></div>
            <div class="fld"><label>批次备注</label><input id="gBatch" placeholder="如 2026Q4-渠道A"></div>
            <button class="btn" id="gGo">生成兑换码</button>
          </div>
          <div id="gOut" class="codes hidden"></div>
          <div id="gActions" class="hidden" style="margin-top:12px"><button class="btn sm gray" id="gCopy">复制全部</button></div>
        </div>
        <div class="panel">
          <div class="pt">兑换码列表</div>
          <div class="row" style="margin-bottom:12px">
            <div class="fld"><label>筛选状态</label>
              <select id="cStatus"><option value="unused">未使用</option><option value="used">已使用</option><option value="revoked">已吊销</option><option value="">全部</option></select>
            </div>
            <button class="btn sm" id="cGo">加载</button>
          </div>
          <div style="overflow:auto;max-height:56vh"><table id="cTable"></table></div>
        </div>
      </div>

      <div class="tab hidden" id="tab-feedback">
        <div class="panel"><button class="btn sm" id="fGo">刷新反馈</button> <span class="muted" id="fCount"></span></div>
        <div class="panel" id="fList"><div class="empty">加载中…</div></div>
      </div>

      <div class="tab hidden" id="tab-telemetry">
        <div class="panel"><div class="row"><div class="fld"><label>时间范围</label>
          <select id="tHours"><option value="24">近 24 小时</option><option value="72">近 3 天</option><option value="168">近 7 天</option></select>
        </div><button class="btn sm" id="tGo">刷新</button></div></div>
        <div class="cards" style="grid-template-columns:1fr 1fr"><div class="panel" style="margin:0"><div class="pt">事件 TOP</div><table id="tEvents"></table></div>
        <div class="panel" style="margin:0"><div class="pt">版本分布</div><table id="tVersions"></table></div></div>
      </div>
    </div>
  </div>
  <div id="toast"></div>

<script>
(function(){
  var SUP_URL='https://whbtqssluvcvhonxcwnt.supabase.co';
  var SUP_ANON='sb_publishable_eQqsWugbYzmkO-YsokY_Ow__-9fxPAv';
  var sb = window.supabase.createClient(SUP_URL, SUP_ANON);
  var $=function(s){return document.querySelector(s);};
  var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};
  function toast(m){ var t=$('#toast'); t.textContent=m; t.classList.add('show'); setTimeout(function(){t.classList.remove('show');},2200); }
  function fmtDate(d){ if(!d) return '—'; try{ return new Date(d).toLocaleString('zh-CN',{hour12:false}); }catch(e){ return d; } }
  function show(el){ el.classList.remove('hidden'); } function hide(el){ el.classList.add('hidden'); }

  async function rpc(fn, args){ var r=await sb.rpc(fn, args||{}); if(r.error){ return {ok:false, status:'rpc_error', msg:r.error.message}; } return r.data; }

  // ---- auth ----
  async function enter(){
    hide($('#login')); show($('#app'));
    var s=await sb.auth.getSession(); var em=(s&&s.data&&s.data.session&&s.data.session.user&&s.data.session.user.email)||'';
    $('#whoami').textContent=em;
    loadOverview();
  }
  async function tryRestore(){
    var s=await sb.auth.getSession();
    if(s && s.data && s.data.session){
      var st=await rpc('admin_stats'); if(st && st.ok){ enter(); return; }
      await sb.auth.signOut();
    }
  }
  $('#loginForm').addEventListener('submit', async function(e){
    e.preventDefault(); $('#lerr').textContent=''; $('#lbtn').disabled=true; $('#lbtn').textContent='登录中…';
    var em=$('#le').value.trim(), pw=$('#lp').value;
    var r=await sb.auth.signInWithPassword({email:em, password:pw});
    if(r.error){ $('#lerr').textContent = /invalid login credentials/i.test(r.error.message)?'邮箱或密码错误':r.error.message; $('#lbtn').disabled=false; $('#lbtn').textContent='登 录'; return; }
    var st=await rpc('admin_stats');
    if(!st || !st.ok){ await sb.auth.signOut(); $('#lerr').textContent='该账号不是管理员，无权访问后台'; $('#lbtn').disabled=false; $('#lbtn').textContent='登 录'; return; }
    $('#lbtn').disabled=false; $('#lbtn').textContent='登 录'; enter();
  });
  $('#logout').onclick=async function(){ await sb.auth.signOut(); location.reload(); };

  // ---- tabs ----
  var loaders={overview:loadOverview, members:loadMembers, codes:loadCodes, feedback:loadFeedback, telemetry:loadTelemetry};
  document.querySelectorAll('.nav a').forEach(function(a){ a.onclick=function(){
    document.querySelectorAll('.nav a').forEach(function(x){x.classList.remove('on');}); a.classList.add('on');
    document.querySelectorAll('.tab').forEach(function(t){hide(t);});
    var id=a.getAttribute('data-tab'); show($('#tab-'+id)); $('#tabTitle').textContent=a.querySelector('.tx').textContent;
    if(loaders[id]) loaders[id]();
  };});

  // ---- overview ----
  async function loadOverview(){
    var st=await rpc('admin_stats'); if(!st||!st.ok){ $('#statCards').innerHTML='<div class="empty">无权限或加载失败</div>'; return; }
    var items=[['活跃会员',st.active_members,''],['会员总数',st.members_total,''],['7天内到期',st.expiring_7d,'acc'],['已过期',st.expired,'warn'],['未用兑换码',st.codes_unused,''],['已用兑换码',st.codes_used,''],['已吊销码',st.codes_revoked,''],['注册用户',st.total_users,''],['反馈总数',st.feedback_total,'acc'],['24h事件',st.events_24h,''],['24h错误',st.error_events_24h,'warn']];
    $('#statCards').innerHTML=items.map(function(it){return '<div class="card '+it[2]+'"><div class="n">'+(+it[1]||0)+'</div><div class="l">'+esc(it[0])+'</div></div>';}).join('');
  }

  // ---- members ----
  async function loadMembers(){
    var st=await rpc('admin_list_memberships',{p_limit:500, p_search:$('#mSearch').value.trim()});
    if(!st||!st.ok){ $('#mTable').innerHTML=''; $('#tab-members .panel:last-child').innerHTML='<div class="empty">加载失败</div>'; return; }
    var rows=st.rows||[];
    if(!rows.length){ $('#mTable').innerHTML='<tr><td class="empty">暂无会员</td></tr>'; return; }
    var h='<thead><tr><th>邮箱</th><th>套餐</th><th>状态</th><th>到期</th><th>店铺</th><th>设备</th></tr></thead><tbody>';
    h+=rows.map(function(r){
      var act=r.lifetime?'<span class="tag on">终身</span>':(r.active?'<span class="tag on">生效中</span>':'<span class="tag off">已过期</span>');
      var exp=r.lifetime?'终身':fmtDate(r.expires_at);
      var soon=(!r.lifetime && r.active && (new Date(r.expires_at)-Date.now())<7*864e5)?' <span class="tag warn">即将到期</span>':'';
      return '<tr><td>'+esc(r.email)+'</td><td>'+esc(r.plan)+'</td><td>'+act+'</td><td>'+esc(exp)+soon+'</td><td class="mono">'+(r.stores_used||0)+'/'+(r.max_stores||0)+'</td><td>'+(r.devices_used||0)+'</td></tr>';
    }).join('');
    $('#mTable').innerHTML=h+'</tbody>';
  }
  $('#mGo').onclick=loadMembers; $('#mRefresh').onclick=loadMembers;
  $('#mSearch').addEventListener('keydown',function(e){ if(e.key==='Enter') loadMembers(); });

  // ---- codes ----
  var lastCodes=[];
  async function genCodes(){
    var pv=$('#gPlan').value.split('|'); var plan=pv[0], days=+pv[1];
    var r=await rpc('admin_generate_codes',{p_plan:plan, p_duration_days:days, p_add_stores:+$('#gStores').value||10, p_count:+$('#gCount').value||10, p_batch:$('#gBatch').value.trim()});
    if(!r||!r.ok){ toast('生成失败：'+((r&&r.status)||'未知')); return; }
    lastCodes=r.codes||[];
    var box=$('#gOut'); box.classList.remove('hidden'); box.textContent=lastCodes.join('\n');
    $('#gActions').classList.remove('hidden'); toast('已生成 '+r.count+' 个兑换码'); loadCodes();
  }
  $('#gGo').onclick=genCodes;
  $('#gCopy').onclick=function(){ navigator.clipboard.writeText(lastCodes.join('\n')).then(function(){toast('已复制到剪贴板');},function(){toast('复制失败，请手动选择');}); };
  async function loadCodes(){
    var st=await rpc('admin_list_codes',{p_status:$('#cStatus').value, p_limit:500});
    if(!st||!st.ok){ $('#cTable').innerHTML=''; return; }
    var rows=st.rows||[];
    if(!rows.length){ $('#cTable').innerHTML='<tr><td class="empty">暂无兑换码</td></tr>'; return; }
    var h='<thead><tr><th>兑换码</th><th>状态</th><th>套餐</th><th>天数</th><th>店铺</th><th>使用者</th><th>批次</th><th></th></tr></thead><tbody>';
    h+=rows.map(function(r){
      var tag=r.status==='unused'?'<span class="tag on">未用</span>':(r.status==='used'?'<span class="tag mut">已用</span>':'<span class="tag off">已吊销</span>');
      var rev=r.status==='unused'?('<button class="btn sm danger" data-rev="'+esc(r.code)+'">吊销</button>'):'';
      return '<tr><td class="mono">'+esc(r.code)+'</td><td>'+tag+'</td><td>'+esc(r.plan)+'</td><td>'+(r.duration_days==null?'终身':r.duration_days)+'</td><td>'+(r.add_stores||0)+'</td><td>'+esc(r.used_by_email||'—')+'</td><td>'+esc(r.batch||'')+'</td><td>'+rev+'</td></tr>';
    }).join('');
    $('#cTable').innerHTML=h+'</tbody>';
    $('#cTable').querySelectorAll('[data-rev]').forEach(function(b){ b.onclick=function(){ revoke(b.getAttribute('data-rev')); }; });
  }
  async function revoke(code){ if(!confirm('确定吊销兑换码 '+code+' ？')) return; var r=await rpc('admin_revoke_code',{p_code:code}); if(r&&r.ok){ toast('已吊销 '+code); loadCodes(); } else toast('吊销失败：'+((r&&r.status)||'')); }
  $('#cGo').onclick=loadCodes;

  // ---- feedback ----
  async function loadFeedback(){
    var st=await rpc('admin_list_feedback',{p_limit:200});
    if(!st||!st.ok){ $('#fList').innerHTML='<div class="empty">加载失败</div>'; return; }
    var rows=st.rows||[]; $('#fCount').textContent=rows.length? ('共 '+rows.length+' 条（最新）'):'';
    if(!rows.length){ $('#fList').innerHTML='<div class="empty">暂无反馈</div>'; return; }
    $('#fList').innerHTML=rows.map(function(r){
      return '<div class="fb"><div class="meta"><b>'+fmtDate(r.created_at)+'</b><span>'+esc(r.email||'匿名')+'</span><span>v'+esc(r.ver||'?')+'</span><span>'+esc(r.region||'')+'</span><span>'+esc(r.plan||'')+'</span>'+(r.contact?('<span>联系 '+esc(r.contact)+'</span>'):'')+'</div>'+
        '<div class="msg">'+esc(r.message||'')+'</div>'+ (r.log?('<pre>'+esc(r.log)+'</pre>'):'') +'</div>';
    }).join('');
  }
  $('#fGo').onclick=loadFeedback;

  // ---- telemetry ----
  async function loadTelemetry(){
    var st=await rpc('admin_telemetry',{p_hours:+$('#tHours').value||24});
    if(!st||!st.ok){ return; }
    var ev=st.top_events||[], vv=st.by_version||[];
    $('#tEvents').innerHTML= ev.length?('<thead><tr><th>事件</th><th>次数</th></tr></thead><tbody>'+ev.map(function(e){return '<tr><td>'+esc(e.event)+'</td><td class="mono">'+e.n+'</td></tr>';}).join('')+'</tbody>'):'<tr><td class="empty">无数据</td></tr>';
    $('#tVersions').innerHTML= vv.length?('<thead><tr><th>版本</th><th>次数</th></tr></thead><tbody>'+vv.map(function(e){return '<tr><td class="mono">'+esc(e.ver)+'</td><td class="mono">'+e.n+'</td></tr>';}).join('')+'</tbody>'):'<tr><td class="empty">无数据</td></tr>';
  }
  $('#tGo').onclick=loadTelemetry;

  tryRestore();
})();
</script>
</body>
</html>
